<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    :root {
      --barra: 88px;
      --sfondo: url("Sfondog.png");
      --colore-fondo: #5a1226;

      /* ▼ COLORI ▼ */
      --oro: #C9A15A;                         /* oro del logo Giada */
      /* Bordeaux con riflesso diagonale, come nella foto; sempre trasparente (0.75 = 25% di trasparenza).
         Per cambiare l'intensità modifica i tre colori; per la trasparenza cambia 0.75 */
      --pannello: linear-gradient(135deg,
                    rgba(122, 20, 48, 0.75) 0%,
                    rgba(100, 14, 36, 0.75) 45%,
                    rgba(74, 8, 26, 0.75) 100%);
      --testo-pannello: #F6EBD6;              /* avorio caldo: nomi delle lingue leggibili sul bordeaux */
    }

    html { background-color: var(--colore-fondo); }

    body::before {
      content: "";
      position: fixed;
      top: var(--barra);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background:
        linear-gradient(to bottom, transparent calc(100% - 180px), var(--colore-fondo) 100%),
        var(--sfondo) center / cover no-repeat;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: calc(var(--barra) + 32px) 24px 24px;
    }

    .barra {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: var(--barra);
      padding: 0 20px;
      background: var(--pannello);
      border-bottom: 1px solid rgba(201, 161, 90, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.2);
    }

    .barra img {
      height: 120px;
      width: 120px;
      object-fit: contain;
      display: block;
    }

    .barra h1 {
      font-family: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
      font-size: 2.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.1;
      color: #D9B26A; /* oro di riserva */
      /* effetto oro metallico in rilievo */
      background: linear-gradient(180deg, #F3DDA6 0%, #D4AB5E 45%, #A57C34 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }

    @media (max-width: 480px) {
      :root { --barra: 64px; }
      .barra { gap: 10px; padding: 0 12px; }
      .barra img { height: 54px; width: 44px; }
      .barra h1 { font-size: 1.05rem; letter-spacing: 0.05em; }
    }

    .riquadro {
      background: var(--pannello);
      border: 1px solid rgba(201, 161, 90, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 44px 56px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    .lingue {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lingue a {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      color: var(--testo-pannello);
      text-decoration: none;
      font-size: 1.5rem;
      transition: background 0.2s;
    }

    .lingue a:hover,
    .lingue a:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      outline: 2px solid var(--oro);
      outline-offset: -2px;
    }

    .bandiera {
      flex: 0 0 auto;
      width: 36px;
      height: 24px;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .bandiera svg { display: block; width: 100%; height: 100%; }

    @media (max-width: 480px) {
      .riquadro { padding: 28px 18px; }
      .lingue a { font-size: 1.3rem; }
    }
  </style>
</head>

  <script>
    (function () {
      var m = getComputedStyle(document.documentElement).getPropertyValue('--sfondo').match(/url\(["']?(.*?)["']?\)/);
      if (!m) return;
      var img = new Image();
      img.onload = function () {
        try {
          var n = 8, c = document.createElement('canvas');
          c.width = c.height = n;
          var x = c.getContext('2d');
          x.drawImage(img, 0, img.height * 0.9, img.width, img.height * 0.1, 0, 0, n, n);
          var d = x.getImageData(0, 0, n, n).data, r = 0, g = 0, b = 0, k = n * n;
          for (var i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
          document.documentElement.style.setProperty('--colore-fondo',
            'rgb(' + Math.round(r / k) + ',' + Math.round(g / k) + ',' + Math.round(b / k) + ')');
        } catch (e) { }
      };
      img.src = m[1];
    })();
  </script>
